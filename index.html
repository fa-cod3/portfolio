<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA Code - Full-Stack Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 800px;
            text-align: center;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #667eea;
        }
        .subtitle {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }
        .stack {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 40px 0;
        }
        .stack-item {
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        .links {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: #764ba2;
        }
        .projects {
            margin-top: 50px;
            text-align: left;
        }
        .project {
            padding: 20px;
            margin: 15px 0;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍💻 FA Code</h1>
        <p class="subtitle">Full-Stack Developer | React & Node.js</p>

        <div class="stack">
            <div class="stack-item">⚛️ React</div>
            <div class="stack-item">🟢 Node.js</div>
            <div class="stack-item">🗄️ PostgreSQL</div>
            <div class="stack-item">🎨 Tailwind CSS</div>
            <div class="stack-item">📱 Responsive</div>
            <div class="stack-item">🚀 Vercel/AWS</div>
        </div>

        <h2 style="margin-top: 40px;">Proyectos</h2>
        <div class="projects">
            <div class="project">
                <h3>Todo App</h3>
                <p>Aplicación de tareas con React y Node.js</p>
                <a href="https://github.com/fa-cod3/todo-app" class="btn">Ver en GitHub</a>
            </div>
            <div class="project">
                <h3>REST API</h3>
                <p>API completa con Node.js y PostgreSQL</p>
                <a href="https://github.com/fa-cod3/api-rest" class="btn">Ver en GitHub</a>
            </div>
        </div>

        <div class="links">
            <a href="https://github.com/fa-cod3" class="btn">GitHub</a>
            <a href="mailto:facod3@gmail.com" class="btn">Email</a>
            <a href="https://linkedin.com/in/fa-cod3" class="btn">LinkedIn</a>
        </div>
    </div>
</body>
</html>
